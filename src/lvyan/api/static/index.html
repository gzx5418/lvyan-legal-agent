<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>律言 · 法律智能体</title>
  <link rel="stylesheet" href="/static/style.css?v=9">
  <link rel="stylesheet" href="/static/legal-answer.css?v=3">
  <link rel="stylesheet" href="/static/print.css?v=1" media="print">
</head>
<body>

<!-- 侧边栏 -->
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M14 2L3 7v3c0 6.5 4.5 12.5 11 14 6.5-1.5 11-7.5 11-14V7L14 2z" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M14 8v8M10 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>律言</span>
    </div>
    <button type="button" id="new-chat" class="new-chat-btn" title="新对话 (Ctrl+N)" aria-label="新建对话">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- 搜索框 -->
  <div class="sidebar-search">
    <label class="sr-only" for="history-search">搜索历史对话</label>
    <input type="search" id="history-search" placeholder="搜索对话…" autocomplete="off">
  </div>

  <div id="history-list" class="history-list"></div>

  <div class="sidebar-footer">
    <button type="button" id="clear-all-history" class="clear-all-btn" title="清空所有历史">清空历史</button>
    <div id="health-status" class="health-status" role="status" aria-live="polite">
      <span class="dot dot-pending"></span>
      <span class="health-text">检查中…</span>
    </div>
  </div>
</aside>

<!-- 主区域 -->
<main id="main">

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="topbar-left">
      <button type="button" id="sidebar-toggle" class="icon-btn" title="折叠侧栏" aria-label="展开或折叠历史侧栏" aria-controls="sidebar" aria-expanded="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 4h12M3 9h12M3 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <span id="thread-label" class="thread-label">新对话</span>
    </div>
    <div class="topbar-right">
      <button type="button" id="export-btn" class="icon-btn" title="导出对话为 Markdown" aria-label="导出对话为 Markdown" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v9M4 7l4 4 4-4M2 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="light" title="简要模式：日常咨询快答">简要</button>
        <button class="mode-btn" data-mode="deep" title="深度模式：案件深度分析报告">深度</button>
        <button class="mode-btn" data-mode="document" title="文书模式：生成法律文书">文书</button>
      </div>
    </div>
  </header>

  <!-- 节点进度条（topbar 下方，独立于滚动区） -->
  <div id="progress-bar" class="progress-bar" role="progressbar" aria-label="分析进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="display:none;">
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div id="progress-nodes" class="progress-nodes"></div>
  </div>

  <!-- 对话区 -->
  <div id="chat-area" class="chat-area">

    <!-- 欢迎屏 -->
    <div id="welcome" class="welcome">
      <div class="welcome-icon">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <path d="M28 4L6 14v6c0 13 9 25 22 28 13-3 22-15 22-28v-6L28 4z" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
          <path d="M28 16v16M20 24h16" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>律言法律智能体</h1>
      <p>证据优先，引用可验证。输入你的法律问题，获得专业分析。</p>
      <div class="quick-questions">
        <button class="quick-q" data-q="公司未经同意公开我的健康信息，是否违法？">公司未经同意公开我的健康信息，是否违法？</button>
        <button class="quick-q" data-q="房东不退押金怎么处理？">房东不退押金怎么处理？</button>
        <button class="quick-q" data-q="劳动合同到期公司不续签，有补偿吗？">劳动合同到期公司不续签，有补偿吗？</button>
        <button class="quick-q" data-q="被网络诽谤如何维权？">被网络诽谤如何维权？</button>
      </div>
    </div>

    <!-- 消息列表（JS 动态插入） -->
    <div id="messages" class="messages" aria-live="polite" aria-relevant="additions" style="display:none;"></div>

    <!-- HITL 审批弹窗 -->
    <div id="hitl-panel" class="hitl-panel" role="region" aria-labelledby="hitl-title" style="display:none;">
      <div class="hitl-card">
        <div class="hitl-header">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L2 18h16L10 2z" stroke="var(--warn)" stroke-width="1.5" fill="none"/><path d="M10 8v4M10 14v.5" stroke="var(--warn)" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="hitl-title">需要人工确认</span>
        </div>
        <p class="hitl-message" id="hitl-message">Agent 尝试执行不可逆操作，请确认是否批准。</p>
        <div class="hitl-actions">
          <button id="hitl-approve" class="hitl-btn hitl-approve">批准</button>
          <button id="hitl-reject" class="hitl-btn hitl-reject">拒绝</button>
          <button id="hitl-edit-toggle" class="hitl-btn hitl-edit">编辑后批准</button>
        </div>
        <div id="hitl-edit-area" class="hitl-edit-area" style="display:none;">
          <textarea id="hitl-edit-text" rows="6" placeholder="编辑输出内容…"></textarea>
          <button id="hitl-edit-submit" class="hitl-btn hitl-approve">提交编辑</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 输入区 -->
  <div id="input-area" class="input-area">
    <!-- 附件预览条 -->
    <div id="attachment-preview" class="attachment-preview" style="display:none;"></div>
    <div class="input-wrapper">
      <button id="upload-btn" class="upload-btn" title="上传文件（合同/证据等）">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 12V3M5 7l4-4 4 4M3 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input type="file" id="file-input" style="display:none;" multiple accept=".txt,.md,.csv,.json,.xml,.html,.htm,.log,.yaml,.yml,.toml,.ini,.rst,.pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls,.odt,.rtf,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tiff,.tif">
      <label class="sr-only" for="query-input">法律问题或合同文本</label>
      <textarea id="query-input" maxlength="50000" placeholder="输入法律问题或合同文本…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button id="stop-btn" class="stop-btn" title="停止生成" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="3" width="8" height="8" rx="1" fill="currentColor"/></svg>
      </button>
      <button id="send-btn" class="send-btn" title="发送 (Enter)">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 10l14-7-5 14-2-5-7-2z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="input-hint">
      <span id="char-count">0 字</span>
      <span>律言基于中国法律知识库分析，结果仅供参考，不构成法律意见。</span>
    </div>
  </div>

</main>

<!-- 右键菜单 / 消息操作菜单 -->
<div id="msg-menu" class="msg-menu" style="display:none;">
  <button data-action="copy" class="menu-item">复制</button>
  <button data-action="regenerate" class="menu-item">重新生成</button>
</div>

<!-- Toast 提示 -->
<div id="toast" class="toast" role="status" aria-live="polite" style="display:none;"></div>

<script src="/static/components.js?v=2"></script>
<script src="/static/app.js?v=11"></script>
</body>
</html>
