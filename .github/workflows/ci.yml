name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: 单元测试 + 集成测试（不依赖外部服务的部分）
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # CI 环境无模型网关 / 法律全文库 / PostgreSQL，走降级路径
      MODEL_GATEWAY_URL: ""
      DATABASE_URL: "postgresql+psycopg://lvyan:lvyan@localhost:5432/lvyan"
      HITL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # 依赖统一按 uv.lock 锁定安装（--frozen），保证 CI 测的依赖集
        # 与 uv.lock / Docker 镜像完全一致（langfuse 4.x 事故的根治点）。
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        # documents extra 覆盖原 markitdown 单独安装；python-multipart 为核心依赖
        run: uv sync --frozen --extra dev --extra documents

      - name: Run tests (exclude slow tests needing law DB)
        run: |
          uv run python -m pytest tests/ -q \
            --tb=short \
            -m "not slow" \
            -p no:cacheprovider \
            --cov=lvyan \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=66 \
            --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2: 金标集回归评测（mock state，不依赖外部服务）
  # ---------------------------------------------------------------------------
  regression:
    name: Golden Set Regression
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MODEL_GATEWAY_URL: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --frozen --extra dev

      - name: Run regression evaluation
        run: |
          uv run python tests/evals/run_regression.py --json regression-report.json

      - name: Verify degrade mode triggers failure
        # run_regression.py 退出码约定：0=通过，1=阈值违反（--degrade 的预期结果），
        # 2=阈值解析失败；未捕获异常（ImportError / golden 损坏）同样非 0 且不会
        # 写出报告 JSON。因此必须同时满足：退出码恰为 1 且报告的
        # threshold_violations 非空——只看「非零即 OK」会把真实故障也判为通过。
        run: |
          set +e
          uv run python tests/evals/run_regression.py --limit 3 --degrade --json degrade-report.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "ERROR: degrade 模式期望退出码 1（阈值失败），实际退出码 $code"
            exit 1
          fi
          uv run python -c '
          import json, sys
          with open("degrade-report.json", encoding="utf-8") as f:
              report = json.load(f)
          violations = report.get("threshold_violations") or []
          if not violations:
              print("ERROR: degrade 报告 threshold_violations 为空，阈值未被触发")
              sys.exit(1)
          print(f"OK: degrade 模式正确触发阈值失败（{len(violations)} 项）")
          '

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2.5: Agent pipeline 端到端回归（P1-4 新增）
  # ---------------------------------------------------------------------------
  pipeline:
    name: Agent Pipeline Regression
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MODEL_GATEWAY_URL: ""
      HITL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # 法规版本质量门禁依赖该子模块中的官方法规全文。
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --frozen --extra dev

      - name: Run full pipeline evaluation
        # 图的降级路径是此评测的目标；官方库质量由下一步单独验证。
        # 否则每条金标问题都会初始化完整法规索引，显著拖慢 CI。
        env:
          LAWTEXT_DIR: ${{ runner.temp }}/lvyan-ci-empty-lawtext
        run: |
          uv run python tests/evals/pipeline_eval.py --json pipeline-report.json

      - name: Verify statute metadata does not regress
        run: |
          uv run python -m lvyan.scripts.sync_sources \
            --baseline knowledge/version_quality_baseline.json \
            --report version-quality-report.json

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline-report.json
          retention-days: 30

      - name: Upload statute metadata quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-quality-report
          path: version-quality-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: 代码风格检查（ruff）—— P1-8：不再软失败
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # ruff 版本也来自 uv.lock（dev extra），避免 pip 解析到与本地/镜像不同的
        # 版本导致格式化规则差异
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --frozen --extra dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Verify no pickle.load in source
        run: |
          if grep -rn "pickle\.load\|pickle\.loads" src/; then
            echo "ERROR: 源码中仍存在 pickle.load/loads 调用"
            exit 1
          else
            echo "OK: 源码无 pickle.load/loads"
          fi

      - name: Verify no import pickle in source
        run: |
          if grep -rn "^[[:space:]]*import pickle" src/; then
            echo "ERROR: 源码中仍存在 import pickle"
            exit 1
          else
            echo "OK: 源码无 import pickle"
          fi

  # ---------------------------------------------------------------------------
  # Job 4: PostgreSQL 集成测试（advisory lock / cancel / 级联删除等）
  # P1-8：真实 PG 测试必须被强制执行；若全部 skip 则本 job 失败。
  # ---------------------------------------------------------------------------
  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lvyan
          POSTGRES_PASSWORD: lvyan
          POSTGRES_DB: lvyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lvyan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      DATABASE_URL: "postgresql+psycopg://lvyan:lvyan@localhost:5432/lvyan"
      LVYAN_TEST_POSTGRES_DSN: "postgresql://lvyan:lvyan@localhost:5432/lvyan"
      MODEL_GATEWAY_URL: ""
      HITL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        # PyJWT[crypto] 与 cryptography 均为核心依赖，由锁定安装覆盖
        run: uv sync --frozen --extra dev

      - name: Run PostgreSQL integration tests
        run: |
          # 记录总数与通过数；若全部被 skip 则失败。
          uv run python -m pytest tests/integration/test_run_metadata_postgres.py \
            -v --tb=short -p no:cacheprovider \
            -rA 2>&1 | tee pg_out.txt
          # 校验至少有一条非 skip 的通过项
          if grep -qE "[^0-9][1-9][0-9]* passed" pg_out.txt; then
            echo "OK: 有真实 PostgreSQL 测试通过"
          else
            echo "ERROR: 没有 PostgreSQL 集成测试被实际执行（全部 skip）"
            exit 1
          fi

  external-services-integration:
    name: Redis and OpenSearch Integration
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONPATH: src
      LVYAN_TEST_REDIS_URL: redis://localhost:6379/15
      LVYAN_TEST_OPENSEARCH_URL: http://localhost:9200

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --frozen --extra dev --extra production

      - name: Run external service integration tests
        run: |
          uv run python -m pytest tests/integration/test_external_services.py -v --tb=short -rA
