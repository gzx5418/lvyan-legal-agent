name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: 单元测试 + 集成测试（不依赖外部服务的部分）
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # CI 环境无模型网关 / 法律全文库 / PostgreSQL，走降级路径
      MODEL_GATEWAY_URL: ""
      DATABASE_URL: "postgresql+psycopg://lvyan:lvyan@localhost:5432/lvyan"
      HITL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install python-multipart markitdown

      - name: Run tests (exclude slow tests needing law DB)
        run: |
          python -m pytest tests/ -q \
            --tb=short \
            -m "not slow" \
            -p no:cacheprovider \
            --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: 金标集回归评测（mock state，不依赖外部服务）
  # ---------------------------------------------------------------------------
  regression:
    name: Golden Set Regression
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MODEL_GATEWAY_URL: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run regression evaluation
        run: |
          python tests/evals/run_regression.py --json regression-report.json

      - name: Verify degrade mode triggers failure
        run: |
          if python tests/evals/run_regression.py --limit 3 --degrade; then
            echo "ERROR: degrade 模式应失败但通过了"
            exit 1
          else
            echo "OK: degrade 模式正确触发阈值失败"
          fi

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2.5: Agent pipeline 端到端回归（P1-4 新增）
  # ---------------------------------------------------------------------------
  pipeline:
    name: Agent Pipeline Regression
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MODEL_GATEWAY_URL: ""
      HITL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pipeline evaluation (前 3 条用例)
        run: |
          python tests/evals/pipeline_eval.py --limit 3 --json pipeline-report.json

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: 代码风格检查（ruff）—— P1-8：不再软失败
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  # ---------------------------------------------------------------------------
  # Job 4: PostgreSQL 集成测试（advisory lock / cancel / 级联删除等）
  # P1-8：真实 PG 测试必须被强制执行；若全部 skip 则本 job 失败。
  # ---------------------------------------------------------------------------
  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lvyan
          POSTGRES_PASSWORD: lvyan
          POSTGRES_DB: lvyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lvyan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      DATABASE_URL: "postgresql+psycopg://lvyan:lvyan@localhost:5432/lvyan"
      LVYAN_TEST_POSTGRES_DSN: "postgresql://lvyan:lvyan@localhost:5432/lvyan"
      MODEL_GATEWAY_URL: ""
      HITL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install PyJWT cryptography

      - name: Run PostgreSQL integration tests
        run: |
          # 记录总数与通过数；若全部被 skip 则失败。
          python -m pytest tests/integration/test_run_metadata_postgres.py \
            -v --tb=short -p no:cacheprovider \
            -rA 2>&1 | tee pg_out.txt
          # 校验至少有一条非 skip 的通过项
          if grep -qE "^[0-9]+ passed" pg_out.txt; then
            echo "OK: 有真实 PostgreSQL 测试通过"
          else
            echo "ERROR: 没有 PostgreSQL 集成测试被实际执行（全部 skip）"
            exit 1
          fi
